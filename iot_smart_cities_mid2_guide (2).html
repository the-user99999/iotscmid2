<div class="q-block">
<div class="q-header">

<div class="easy-box"><strong>Understand in one line:</strong> Connected medical devices make care easier, but hackers may target their software, network or data.</div>

<h3>Introduction</h3>
<p>Medical IoT devices such as pacemakers, infusion pumps, health trackers and heart monitors collect and exchange sensitive health information. <strong>Cybersecurity threats</strong> are attacks that can affect their privacy, accuracy or availability.</p>

<h3>1. How an attacker enters (attack vectors)</h3>
<ol>
  <li><strong>Malware:</strong> A Trojan, worm or other harmful program may interfere with device operation.</li>
  <li><strong>Software and firmware flaws:</strong> Unpatched bugs and insecure update mechanisms may allow unauthorized access.</li>

<h3>2. What an attacker can do</h3>
<ol start="4">

  <li><strong>Unauthorized changes:</strong> Modify a device configuration, alarm threshold or treatment setting.</li>
  <li><strong>Spoofing and data manipulation:</strong> Send false readings or impersonate a trusted device.</li>
</ol>

<h3>3. Effects on patients</h3>

  <li><strong>Incorrect decisions:</strong> Modified readings may mislead clinical staff.</li>
  <li><strong>Service interruption:</strong> Monitoring or device functions may be disrupted.</li>
</ul>

<p><strong>Example:</strong> If a heart-rate monitor reports an altered value, the doctor may assess the patient incorrectly.</p>

<div class="q-block">
<div class="q-header">
  <div class="q-num">Part B · Q2 · 4 Marks · CO-3 · BL-2</div>
  <div class="q-title">Illustrate countermeasures used to protect IoT-based medical devices against cybersecurity threats.</div>

<div class="easy-box"><strong>Understand in one line:</strong> Countermeasures are protections that stop attackers or reduce the harm they cause.</div>

<h3>Introduction</h3>
<p>Medical IoT security uses technical controls to keep patient information confidential, correct and available to authorized healthcare workers.</p>

<h3>Important countermeasures</h3>
<ol>
  <li><strong>Confidentiality — encryption:</strong> Encrypt stored and transmitted patient data so outsiders cannot easily read it. Efficient symmetric cryptography is useful for constrained devices.</li>
  <li><strong>Integrity — hashes, MACs and digital signatures:</strong> Help detect whether messages or software updates have been modified.</li>
  <li><strong>Availability — monitoring and DoS defenses:</strong> Detect unusual traffic, battery depletion or communication failures, and provide timely alerts.</li>
  <li><strong>Authentication:</strong> Verify the identity of doctors, patients, servers and devices before granting access.</li>
  <li><strong>Authorization / access control:</strong> Use access-control lists (ACLs) so only approved staff can change therapy settings.</li>
  <li><strong>Nonrepudiation / auditing:</strong> Maintain secure activity logs so sensitive operations are traceable.</li>
  <li><strong>Regular secure updates:</strong> Apply validated firmware patches and remove weak default passwords.</li>
</ol>

<p><strong>Example:</strong> An insulin pump accepts setting changes only from an authorized clinical device, records the action and protects the connection.</p>

<p><strong>Conclusion:</strong> Encryption, identity checks, access rules and monitoring work together to improve medical device security.</p>

<div class="q-block">
<div class="q-header">
  <div class="q-num">Part B · Q4 · 8 Marks · CO-4 · BL-3</div>
  <div class="q-title">Explain the role of IoT for charge scheduling optimization at EV charging stations.</div>
  <div class="q-marks">8M</div>
</div>

<div class="easy-box"><strong>Understand in one line:</strong> Charging scheduling chooses when and how fast electric vehicles should charge, so vehicles get enough energy without overloading the electricity grid.</div>

<h3>Introduction</h3>
<p>An <strong>Electric Vehicle (EV)</strong> uses a battery and an electric motor. When many vehicles charge at once, a charging station may face high demand and stress the local transformer. <strong>IoT-based charge scheduling</strong> uses connected chargers, vehicle information and electricity-grid data to plan charging sessions.</p>

<h3>Objectives of charge scheduling</h3>
<ol>
  <li><strong>Avoid grid congestion:</strong> Keep total charging demand within safe network limits.</li>
  <li><strong>Reduce cost:</strong> Prefer low-tariff periods where charging can be delayed.</li>
  <li><strong>Reduce peak load:</strong> Spread charging sessions across time.</li>
  <li><strong>Meet drivers' needs:</strong> Provide enough charge before planned departure.</li>
  <li><strong>Use renewable energy:</strong> Schedule more charging when solar or wind power is available.</li>
</ol>

<h3>Information collected by IoT</h3>
<ul>
  <li><strong>Battery State of Charge (SoC):</strong> How full the EV battery is, expressed as a percentage.</li>
  <li><strong>Required energy:</strong> How much charge the driver needs.</li>
  <li><strong>Arrival and departure time:</strong> How long the car can stay connected.</li>
  <li><strong>Charger capacity and station load:</strong> Available charging power.</li>
  <li><strong>Electricity price and grid conditions:</strong> Limits and tariff periods.</li>
  <li><strong>Renewable availability:</strong> For example, expected solar output.</li>
</ul>

<h3>How the system works</h3>
<ol>
  <li>The vehicle connects to a smart charging station.</li>
  <li>The charger reports battery requirements and power capacity to the platform.</li>
  <li>The IoT server checks the grid load, charging requests, prices and available renewable energy.</li>
  <li>A scheduling algorithm assigns a start time and charging power to each EV.</li>
  <li>The charger follows the schedule; the system can revise it when conditions change.</li>
  <li>An app displays charging progress and expected completion.</li>
</ol>

<h3>Centralized and decentralized scheduling</h3>
<table>
  <tr><th>Centralized scheduling</th><th>Decentralized scheduling</th></tr>
  <tr><td>One central controller optimizes many connected chargers.</td><td>Each charger/vehicle makes local decisions under shared rules or coordination.</td></tr>
  <tr><td>Gives the operator a system-wide view.</td><td>Can reduce dependence on a single controller.</td></tr>
  <tr><td>Example: a station server schedules 20 EVs.</td><td>Example: local chargers coordinate charging limits.</td></tr>
</table>

<h3>Grid interaction</h3>
<ul>
  <li><strong>G2V (Grid-to-Vehicle):</strong> Grid supplies electricity to the EV.</li>
  <li><strong>V2G (Vehicle-to-Grid):</strong> A compatible EV may feed energy back into the grid when supported.</li>
  <li><strong>V2V (Vehicle-to-Vehicle):</strong> Energy exchange between suitable vehicles in supported systems.</li>
</ul>

<h3>Example</h3>
<p>Ten vehicles arrive at the same charging station. Instead of charging every vehicle at full power immediately, the system gives urgent departures priority and shifts flexible sessions to later, cheaper periods.</p>

<p><strong>Conclusion:</strong> IoT scheduling reduces peaks, manages electricity demand, improves station utilization and can lower charging costs.</p>

<div class="q-block">
<div class="q-header">
  <div class="q-num">Part B · Q6 · 8 Marks · CO-5 · BL-3</div>
  <div class="q-title">How can IoT improve the efficiency of water storage systems in smart cities?</div>
  <div class="q-marks">8M</div>
</div>

<div class="easy-box"><strong>Understand in one line:</strong> IoT watches tanks, reservoirs, pumps and pipelines so cities know how much water they have and can avoid overflow, leaks and unnecessary pumping.</div>

<h3>Introduction</h3>
<p>Water storage systems include reservoirs, sumps and overhead tanks. A <strong>conveyance system</strong> transports water using pipes, pumps and valves. IoT connects these parts with sensors, controllers and monitoring software.</p>

<h3>Components</h3>
<ul>
  <li><strong>Source / reservoir:</strong> Collects raw or treated water.</li>
  <li><strong>Sump:</strong> Lower-level storage tank, often used before pumping to elevated storage.</li>
  <li><strong>ESR (Elevated Service Reservoir):</strong> Elevated tank that supplies water by gravity where possible.</li>
  <li><strong>Pumps and pipes:</strong> Move water across the distribution network.</li>
  <li><strong>IoT sensors:</strong> Measure level, flow, pressure and quality.</li>
</ul>

<h3>Working</h3>
<ol>
  <li>A level sensor measures the water level in a tank or sump.</li>
  <li>Flow and pressure sensors monitor pipelines and pumps.</li>
  <li>A controller reads the sensors and sends data through an IoT network.</li>
  <li>A dashboard shows real-time levels, flow and alerts.</li>
  <li>When the tank level is low, an authorized automatic controller may start the pump.</li>
  <li>When the tank is full, the pump switches off to avoid overflow.</li>
  <li>Abnormal flow or pressure patterns trigger inspection alerts.</li>
</ol>

<h3>Major benefits</h3>
<ol>
  <li><strong>Real-time water-level monitoring:</strong> Officials know current tank and reservoir levels.</li>
  <li><strong>Automatic pump control:</strong> Pumps operate only when water is needed, reducing manual work.</li>
  <li><strong>Leakage detection:</strong> Flow and pressure readings identify possible hidden water loss.</li>
  <li><strong>Overflow prevention:</strong> High-level alarms or interlocks stop overfilling.</li>
  <li><strong>Water-quality checks:</strong> Sensors such as pH and turbidity help identify abnormal quality.</li>
  <li><strong>Demand prediction:</strong> Past consumption helps plan the amount of water to store.</li>
  <li><strong>Remote monitoring:</strong> Multiple tanks can be supervised through one dashboard.</li>
  <li><strong>Energy savings:</strong> Intelligent pump scheduling can avoid unnecessary operating hours.</li>
  <li><strong>Maintenance planning:</strong> Equipment readings help staff detect possible pump or valve problems.</li>

<div class="q-block">
<div class="q-header">
  <div class="q-num">Add-On · QA1 · 8 Marks · CO-4 · BL-2</div>
  <div class="q-title">Explain the four layers of the Smart Parking System (SPS) architecture with a neat diagram.</div>
  <div class="q-marks">8M</div>
</div>

<div class="easy-box"><strong>Understand in one line:</strong> The four layers collect parking information, carry it to a server, process it and finally show available spots to drivers.</div>

<h3>Introduction</h3>
<p>A <strong>Smart Parking System (SPS)</strong> uses IoT sensors, communication networks and software to detect free parking spaces and guide drivers. Its architecture has <strong>four layers</strong>.</p>

<h3>1. Sensing layer</h3>
<ul>
  <li>This is the <strong>bottom layer</strong> installed at parking slots.</li>
  <li>Ultrasonic, infrared, magnetic, CCTV or other suitable sensors detect the presence or absence of a vehicle.</li>
  <li>Each space is marked <strong>free</strong> or <strong>occupied</strong>.</li>
</ul>

<h3>2. Networking layer</h3>
<ul>
  <li>Carries readings from sensors to a gateway or server.</li>
  <li>Suitable technologies include <strong>ZigBee, Wi-Fi, LoRaWAN or cellular communication</strong>, depending on site conditions.</li>
  <li>It connects physical parking sensors to the software system.</li>
</ul>

<h3>3. Middleware layer</h3>
<ul>
  <li>The <strong>processing layer</strong>, usually containing an application server and database.</li>
  <li>Collects sensor readings, stores slot status and processes parking requests.</li>
  <li>May manage reservations, occupancy history and payments.</li>
  <li>Sends updated availability information to the application layer.</li>
</ul>

<h3>4. Application layer</h3>
<ul>
  <li>The <strong>user interface layer</strong> for drivers and parking operators.</li>
  <li>Mobile apps, websites or entrance displays show which slots are free.</li>
  <li>Where implemented, users can reserve a slot, receive directions and pay electronically.</li>
</ul>

<h3>Step-by-step working</h3>
<ol>
  <li>A vehicle enters parking slot P12.</li>
  <li>The sensing layer detects that the slot is occupied.</li>
  <li>The networking layer sends that reading to the middleware.</li>
  <li>The middleware updates P12 as <em>occupied</em> in the database.</li>
  <li>The application immediately displays the updated status to drivers.</li>
</ol>

<h3>Benefits</h3>
<ol>
  <li>Saves drivers' search time.</li>
  <li>Reduces congestion around parking lots.</li>
  <li>Uses available spaces more efficiently.</li>
  <li>Makes digital payments and reservations possible.</li>
  <li>Provides occupancy data to parking operators.</li>
  <li>Can reduce unnecessary fuel consumption while searching for parking.</li>
</ol>

<p><strong>Conclusion:</strong> The four layers work together to convert sensor readings into useful parking guidance and management services.</p>

<div class="diagram-box">

<div class="q-block">
<div class="q-header">
  <div class="q-num">Add-On · QA2 · 8 Marks · CO-5 · BL-2</div>
  <div class="q-title">Discuss the key challenges in IoT-based Smart Water Network Management (SWNM).</div>
  <div class="q-marks">8M</div>
</div>

<div class="easy-box"><strong>Understand in one line:</strong> A smart water network covers huge areas. Keeping all the sensors powered, connected, secure and working together is difficult.</div>

<h3>Introduction</h3>
<p><strong>Smart Water Network Management (SWNM)</strong> uses connected sensors, meters and control systems to monitor water flow, water quality, storage and pipeline condition. Large-scale installation introduces technical, financial and operational challenges.</p>

<h3>Eight major challenges</h3>
<ol>
  <li><strong>Power usage:</strong> Many water sensors use batteries in remote locations. Frequent measurement and wireless transmission drain batteries quickly, increasing maintenance needs.</li>
  <li><strong>System complexity:</strong> One network may handle water level, flow, pressure, quality, leakage and automated valves. Integrating all these functions is difficult.</li>
  <li><strong>Installation cost:</strong> Large cities need many meters, gateways, controllers and sensors spread across wide areas. Equipment and installation are expensive.</li>
  <li><strong>Connectivity:</strong> Underground pipes, concrete structures and remote water facilities may weaken radio signals or make network access unreliable.</li>
  <li><strong>Security and privacy:</strong> Connected meters and industrial controllers can be attacked. Secure authentication, encrypted communication and access control are necessary.</li>
  <li><strong>Large data volumes:</strong> Continuous readings from thousands of sensors create storage and analysis workloads. Operators need useful alerts rather than raw data alone.</li>
  <li><strong>Network coverage:</strong> It is difficult to cover every reservoir, pipe section and distant pumping station. Poor coverage can create monitoring gaps.</li>
  <li><strong>Interoperability:</strong> Older water systems and newer equipment may use different data formats, protocols and interfaces. Making them work together requires integration.</li>
</ol>

<h3>Practical improvements</h3>
<ul>
  <li>Use low-power sensors and carefully chosen reporting intervals.</li>
  <li>Choose the appropriate wired or wireless network for each location.</li>
  <li>Add gateways or repeaters where coverage is poor.</li>
  <li>Maintain cybersecurity updates, credentials and access control.</li>
  <li>Standardize data interfaces and plan maintenance budgets.</li>
</ul>

<h3>Example</h3>
<p>A water utility installs pressure sensors in underground pipes. Signals are weak, batteries are difficult to replace and the old monitoring server uses a different data format. These are <strong>connectivity, power and interoperability</strong> challenges.</p>

<p><strong>Conclusion:</strong> Reliable SWNM requires balancing power, cost, security, coverage, data management and compatibility to provide continuous, useful monitoring.</p>

    <div class="compare-card" style="border-left:3px solid var(--orange);"><h4 style="color:var(--orange);">🔧 Complexity</h4><p style="font-size:12px;">Multi-function integration: level, flow, pressure, quality, leakage, valves</p></div>
    <div class="compare-card" style="border-left:3px solid var(--yellow);"><h4 style="color:var(--yellow);">💰 Cost</h4><p style="font-size:12px;">Large geographic sensor &amp; gateway deployment</p></div>

let currentUnit = 0;

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  courseData.units.forEach((unit, ui) => {
    const btn = document.createElement('button');
    btn.className = 'unit-btn' + (ui === currentUnit ? ' active' : '');
    btn.innerHTML = unit.title + '<span class="ch">▸</span>';
    btn.onclick = () => { currentUnit = ui; currentSection = 0; renderSidebar(); renderContent(); };
    nav.appendChild(btn);
    const list = document.createElement('div');
    list.className = 'sec-list' + (ui === currentUnit ? ' open' : '');
    unit.sections.forEach((sec, si) => {
      const link = document.createElement('a');
      link.className = 'sec-link' + (ui === currentUnit && si === currentSection ? ' active' : '');
      link.textContent = sec.title;
      link.onclick = (e) => { e.preventDefault(); currentUnit = ui; currentSection = si; renderSidebar(); renderContent(); };
      list.appendChild(link);
    });
    nav.appendChild(list);
  });
}

function renderContent() {
  const area = document.getElementById('contentArea');
  const unit = courseData.units[currentUnit];
  const sec = unit.sections[currentSection];
  let html = sec.content;
  const prevDisabled = currentUnit === 0 && currentSection === 0;
  const nextDisabled = currentUnit === courseData.units.length - 1 && currentSection === unit.sections.length - 1;
  let prevTarget = null, nextTarget = null;
  if (!prevDisabled) {
    if (currentSection > 0) prevTarget = [currentUnit, currentSection - 1];
    else prevTarget = [currentUnit - 1, courseData.units[currentUnit - 1].sections.length - 1];
  }
  if (!nextDisabled) {
    if (currentSection < unit.sections.length - 1) nextTarget = [currentUnit, currentSection + 1];
    else nextTarget = [currentUnit + 1, 0];
  }
  html += '<div class="top-nav">';
  html += '<button class="nav-btn" ' + (prevDisabled ? 'disabled' : '') + ' onclick="' + (prevTarget ? 'jumpTo(' + prevTarget[0] + ',' + prevTarget[1] + ')' : '') + '">← Previous</button>';
  html += '<span style="font-size:13px; color:var(--text-tertiary);">' + (currentSection + 1) + ' of ' + unit.sections.length + '</span>';
  html += '<button class="nav-btn" ' + (nextDisabled ? 'disabled' : '') + ' onclick="' + (nextTarget ? 'jumpTo(' + nextTarget[0] + ',' + nextTarget[1] + ')' : '') + '">Next →</button>';
  html += '</div>';
  if (currentSection === unit.sections.length - 1 && flashcardData[currentUnit]) {
    html += '<h2 style="margin-top:40px; font-size:20px;">Quick Review Flashcards</h2>';
    html += '<p style="font-size:13px; color:var(--text-tertiary); margin-bottom:16px;">Click cards to reveal answers</p>';
    flashcardData[currentUnit].forEach(function(card) {
      html += '<div class="flashcard" onclick="this.classList.toggle(\'flipped\')"><div class="fc-q">' + card.q + '</div><div class="fc-a">' + card.a + '</div><div class="fc-hint">Click to flip</div></div>';
    });
  }
  area.innerHTML = html;
  readSections.add(sec.id);
  updateProgress();
  window.scrollTo(0, 0);
}

function updateProgress() {
  const total = courseData.units.reduce(function(a, u) { return a + u.sections.length; }, 0);
  const pct = Math.round((readSections.size / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '% complete';
}

          const idx = text.indexOf(q);
          const snippet = rawText.substring(Math.max(0, idx - 30), idx + 60);
          matches.push({ui: ui, si: si, title: s.title, snippet: '...' + snippet + '...'});
        }
      });
    });
    if (!matches.length) { res.innerHTML = '<div class="search-result"><span style="color:var(--text-tertiary)">No results</span></div>'; }
    else {
      res.innerHTML = matches.map(function(m) {
        return '<div class="search-result" onclick="jumpTo(' + m.ui + ',' + m.si + '); document.getElementById(\'searchResults\').style.display=\'none\'; document.getElementById(\'searchBox\').value=\'\';"><div class="sr-title">' + m.title + '</div><div class="sr-snippet">' + m.snippet + '</div></div>';
      }).join('');
    }
    res.style.display = 'block';
  });
  document.addEventListener('click', function(e) {
    if (!box.contains(e.target) && !res.contains(e.target)) res.style.display = 'none';
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

renderSidebar();
renderContent();
setupSearch();
</script>
</body>
</html>
